<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>全国秋招信息工作台</title>
  <style>
    :root{--blue:#1769aa;--blue-dark:#123b5d;--blue-soft:#eaf4fb;--line:#d9e5ef;--ink:#183246;--muted:#6b7d8d;--paper:#f5f9fc;--white:#fff;--green:#2e8b68;--orange:#d97b28;--shadow:0 8px 24px rgba(27,74,108,.08);--sans:"Microsoft YaHei",Aptos,Arial,sans-serif;--serif:Georgia,"Songti SC",serif}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans)}button,input,select,textarea{font:inherit}button{cursor:pointer}a{color:var(--blue)}
    .app{min-height:100vh;display:grid;grid-template-columns:220px minmax(0,1fr)}.sidebar{background:#fff;border-right:1px solid var(--line);padding:28px 16px;display:flex;flex-direction:column}.brand{padding:0 10px 28px}.kicker,.eyebrow{font-size:11px;color:var(--blue);letter-spacing:.12em;font-weight:700}.brand h1{margin:8px 0 0;font:500 27px/1.18 var(--serif);color:var(--blue-dark)}.brand p{font-size:12px;color:var(--muted);line-height:1.6;margin:11px 0 0}.nav{display:grid;gap:4px}.nav button{border:0;background:transparent;border-radius:6px;color:var(--muted);padding:11px 10px;text-align:left;font-size:13px}.nav button:hover,.nav button.active{background:var(--blue-soft);color:var(--blue-dark)}.nav button.active{font-weight:700;box-shadow:inset 3px 0 var(--blue)}.nav-mark{display:inline-block;width:22px;color:var(--blue);font-weight:700}.side-bottom{margin-top:auto;border-top:1px solid var(--line);padding:16px 10px 0;font-size:11px;color:var(--muted);line-height:1.7}
    .main{min-width:0}.topbar{min-height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:18px;padding:17px clamp(18px,4vw,48px)}.top-title{font:500 22px var(--serif);color:var(--blue-dark);margin-top:3px}.top-actions{display:flex;gap:8px;align-items:center}.today{font-size:11px;color:var(--muted);margin-right:6px}.content{max-width:1500px;padding:32px clamp(18px,4vw,48px) 58px}.head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:26px}.head h2{font:500 32px/1.2 var(--serif);margin:4px 0;color:var(--blue-dark)}.head p{margin:9px 0 0;color:var(--muted);font-size:12px}.btn{border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);padding:9px 12px;font-size:12px}.btn:hover{border-color:var(--blue);color:var(--blue)}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn.subtle{background:var(--blue-soft);border-color:#cfe4f3;color:var(--blue-dark)}
    .stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px}.stat{background:#fff;border:1px solid var(--line);border-radius:7px;padding:17px 18px;box-shadow:var(--shadow);min-height:104px}.stat-label{font-size:11px;color:var(--muted)}.stat-value{font:500 30px var(--serif);color:var(--blue-dark);margin-top:9px}.stat-context{font-size:10px;color:var(--muted);margin-top:4px}.section-title{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:30px 0 12px}.section-title h3{font-size:14px;margin:0;color:var(--blue-dark)}.section-title span{font-size:11px;color:var(--muted)}
    .deadline-grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(260px,.8fr);gap:12px}.deadline-list,.source-box,.panel{background:#fff;border:1px solid var(--line);border-top:2px solid var(--blue);padding:0 17px}.deadline-item{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:13px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}.deadline-item:last-child{border-bottom:0}.deadline-date{font:500 16px var(--serif);color:var(--blue)}.deadline-date small{display:block;font:11px var(--sans);color:var(--muted);margin-top:3px}.deadline-name{font-size:12px;font-weight:700}.deadline-meta{font-size:11px;color:var(--muted);margin-top:4px}.source-box{border-top-color:var(--blue-dark);padding:18px}.source-box h4{font:500 18px var(--serif);margin:0;color:var(--blue-dark)}.source-box p{font-size:11px;line-height:1.8;color:var(--muted);margin:10px 0 14px}.source-links{display:flex;flex-wrap:wrap;gap:6px}.source-link{background:var(--blue-soft);padding:7px 8px;border-radius:4px;text-decoration:none;font-size:11px}
    .toolbar{display:flex;flex-wrap:wrap;gap:8px;padding:12px;border:1px solid var(--line);background:#fff}.field{min-width:120px;border:1px solid var(--line);background:#fff;border-radius:5px;padding:9px 10px;color:var(--ink);font-size:11px}.search{flex:1 1 220px}.field:focus,textarea:focus{outline:2px solid #bcdced;border-color:var(--blue)}.table-wrap{overflow-x:auto;border:1px solid var(--line);background:#fff}.table-wrap table{border-collapse:collapse;width:100%;min-width:1220px}.table-wrap th,.table-wrap td{padding:11px 12px;text-align:left;border-bottom:1px solid var(--line);font-size:11px;vertical-align:top}.table-wrap th{background:#eef6fb;color:var(--muted);font-size:10px;font-weight:700;white-space:nowrap}.table-wrap tr:hover td{background:#f8fcff}.table-wrap tr:last-child td{border-bottom:0}.company{font-size:12px;font-weight:700;color:var(--blue-dark);line-height:1.4}.sub{color:var(--muted);font-size:10px;line-height:1.5;margin-top:3px}.tag{display:inline-flex;white-space:nowrap;border-radius:12px;background:var(--blue-soft);color:var(--blue-dark);padding:4px 7px;font-size:10px}.tag.green{background:#e8f6ef;color:var(--green)}.tag.orange{background:#fff1df;color:var(--orange)}.muted{color:var(--muted)}.empty{padding:28px;text-align:center;color:var(--muted);font-size:11px}
    .pipeline{display:grid;grid-template-columns:repeat(6,minmax(145px,1fr));gap:9px;overflow-x:auto;padding-bottom:5px}.lane{background:#edf4f8;border-top:2px solid var(--line);padding:10px;min-height:220px}.lane-head{display:flex;justify-content:space-between;font-size:11px;font-weight:700;color:var(--blue-dark);margin-bottom:9px}.count{font-weight:400;color:var(--muted)}.job-card{background:#fff;border:1px solid var(--line);border-left:3px solid var(--blue);padding:10px;margin-bottom:8px}.job-card h4{font-size:11px;line-height:1.45;margin:0}.job-card p{font-size:10px;color:var(--muted);line-height:1.5;margin:6px 0}.job-card select{width:100%;border:1px solid var(--line);background:#fff;padding:6px;border-radius:4px;font-size:10px;color:var(--ink)}
    .split{display:grid;grid-template-columns:240px minmax(0,1fr);gap:15px}.version-list{border-right:1px solid var(--line);padding-right:15px}.version-item{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;padding:13px 9px;color:var(--muted)}.version-item.active{background:var(--blue-soft);color:var(--blue-dark)}.version-item strong{display:block;font-size:12px}.version-item span{display:block;font-size:10px;margin-top:4px}.editor{display:grid;gap:11px}.editor label,.form-grid label{font-size:11px;font-weight:700;color:var(--blue-dark)}textarea{width:100%;border:1px solid var(--line);border-radius:5px;background:#fff;padding:10px;color:var(--ink);font-size:11px;line-height:1.6;resize:vertical;min-height:105px}.profile-grid,.jd-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.panel{padding:17px;border-top-color:var(--blue-dark)}.panel h3{font:500 19px var(--serif);color:var(--blue-dark);margin:0 0 13px}.suggestion-list{font-size:11px;line-height:1.8;padding-left:18px;margin:0}.suggestion-list li::marker{color:var(--blue)}.interview-layout,.prep-grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(260px,.75fr);gap:13px}.interview-row{display:grid;grid-template-columns:90px minmax(0,1fr) 55px;gap:11px;padding:12px 0;border-bottom:1px solid var(--line)}.interview-row:last-child{border-bottom:0}.interview-date{font:500 13px var(--serif);color:var(--blue)}.interview-date small{display:block;font:10px var(--sans);color:var(--muted);margin-top:4px}.interview-main strong{font-size:12px}.interview-main p{font-size:10px;color:var(--muted);line-height:1.6;margin:5px 0}.form-grid{display:grid;gap:9px}.form-grid input,.form-grid select{width:100%;margin-top:4px;padding:8px;border:1px solid var(--line);border-radius:4px;background:#fff;color:var(--ink);font-size:11px}.command{background:#133e61;color:#edf8ff;border-radius:5px;padding:13px;font:11px/1.7 Consolas,monospace;white-space:pre-wrap}.small-note{font-size:10px;color:var(--muted);line-height:1.6}.toast{position:fixed;right:18px;bottom:18px;background:#123b5d;color:#fff;border-radius:5px;padding:11px 13px;font-size:11px;opacity:0;transform:translateY(8px);pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:translateY(0)}
    @media(max-width:1000px){.app{grid-template-columns:185px 1fr}.stats{grid-template-columns:repeat(2,1fr)}.deadline-grid,.interview-layout,.prep-grid{grid-template-columns:1fr}.pipeline{grid-template-columns:repeat(6,155px)}}@media(max-width:680px){.app{display:block}.sidebar{padding:15px 12px 10px;border-right:0;border-bottom:1px solid var(--line)}.brand{padding:0 6px 12px}.brand h1{font-size:23px}.brand p,.side-bottom{display:none}.nav{display:flex;overflow-x:auto}.nav button{white-space:nowrap;padding:9px}.nav button.active{box-shadow:inset 0 -3px var(--blue)}.topbar{padding:14px 16px;align-items:flex-start}.today{display:none}.top-actions .subtle{display:none}.content{padding:23px 15px 42px}.head{align-items:flex-start;flex-direction:column;margin-bottom:19px}.head h2{font-size:27px}.stats{grid-template-columns:1fr 1fr;gap:8px}.stat{padding:13px;min-height:92px}.stat-value{font-size:25px}.deadline-item{grid-template-columns:58px minmax(0,1fr)}.deadline-item .tag{grid-column:2;width:fit-content}.split,.profile-grid,.jd-grid{grid-template-columns:1fr}.version-list{display:flex;overflow-x:auto;border-right:0;padding-right:0;gap:5px}.version-item{min-width:140px;border:1px solid var(--line)}.toolbar{gap:6px}.field{flex:1 1 130px;min-width:0}}
  </style>
</head>
<body>
<div class="app">
  <aside class="sidebar"><div class="brand"><div class="kicker">NATIONWIDE / 2027</div><h1>全国秋招<br>信息工作台</h1><p>把具体公司、具体岗位和投递进度放在一张桌面上。</p></div><nav class="nav" aria-label="工作台模块"><button class="active" data-view="dashboard"><span class="nav-mark">▦</span>岗位看板</button><button data-view="jobs"><span class="nav-mark">↗</span>岗位管理</button><button data-view="resumes"><span class="nav-mark">▤</span>简历定制</button><button data-view="interviews"><span class="nav-mark">◷</span>面试进度</button><button data-view="prep"><span class="nav-mark">✦</span>面试准备</button></nav><div class="side-bottom">每天 08:00 自动更新<br>范围：全国 · 央企 / 国企 / 民企 / 外企</div></aside>
  <main class="main"><header class="topbar"><div><div class="eyebrow">2027 CAMPUS RECRUITMENT</div><div class="top-title" id="topbarTitle">岗位看板</div></div><div class="top-actions"><span class="today" id="todayText"></span><button class="btn" id="exportBtn">导出备份</button><button class="btn primary" id="refreshBtn">同步岗位</button></div></header><div class="content" id="content"></div></main>
</div><div class="toast" id="toast" role="status"></div>
<script>
const EMBEDDED_DATA = {"generatedAt":"2026-09-01T07:52:23.1969068+08:00","scope":"全国","notice":"全国秋招记录：有明确公司名且公告含 2027 届校园/秋招语义即可保留；岗位明细可为空并标记为招聘公告。社会招聘、社招、实习和无法识别公司的泛入口不进入记录。专业、城市、学历、报名起止和工资仅在原公告明确时填写。","records":[{"id":"job-e398a6c55f2e4096b62ed9f7e7d75315","company":"华为技术有限公司","position":"","recordType":"招聘公告","major":"","city":"","category":"民企","education":"","startDate":"","deadline":"","salaryText":"","salaryMin":null,"source":"huawei.com","publishedAt":"","url":"https://career.huawei.com/cn/news-and-updates/fresh-graduate-of-2027","verified":true,"sourceType":"company-official"}]};
const KEY='autumn-workbench-2027-v2';
const statuses=['未投递','已投递','笔试中','面试中','offer','已拒绝'];
const defaultState={records:EMBEDDED_DATA.records,applications:[],resumes:[{id:'resume-general',name:'通用版',direction:'综合管理 / 管培',content:'待导入简历正文。建议突出结构化表达、项目推进、协作与量化结果。'},{id:'resume-tech',name:'技术与数字化版',direction:'技术 / 数据 / 数字化',content:'待导入简历正文。建议突出工具、指标、系统和落地结果。'}],interviews:[],profile:{strengths:'请在这里填写你的优势',weaknesses:'请在这里填写待改善项',checklist:'□ 1分钟自我介绍\n□ 3个 STAR 项目案例\n□ 目标公司行业研究\n□ 反问问题清单'}};
let state=loadState(),currentView='dashboard',selectedResume=state.resumes[0]?.id||'';
function loadState(){try{const saved=JSON.parse(localStorage.getItem(KEY));if(!saved)return structuredClone(defaultState);const rows=[...(saved.records||[])],known=new Set(rows.map(r=>r.id));EMBEDDED_DATA.records.forEach(r=>{if(!known.has(r.id))rows.push(r)});return {...defaultState,...saved,records:rows}}catch(_){return structuredClone(defaultState)}}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function toast(m){const e=document.getElementById('toast');e.textContent=m;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),2200)}
function fmtDate(v){if(!v)return'未公布';const d=new Date(v+'T00:00:00');return Number.isNaN(d.getTime())?v:`${d.getMonth()+1}月${d.getDate()}日`}function days(v){if(!v)return null;return Math.ceil((new Date(v+'T23:59:59')-new Date())/86400000)}function rec(id){return state.records.find(r=>r.id===id)}function app(id){return state.applications.find(a=>a.recordId===id)}function tag(v,kind=''){return`<span class="tag ${kind}">${esc(v||'未公布')}</span>`}
function upcoming(){return state.records.filter(r=>r.deadline&&days(r.deadline)>=0&&days(r.deadline)<=14).sort((a,b)=>a.deadline.localeCompare(b.deadline))}
function render(){document.getElementById('content').innerHTML=views[currentView]();document.getElementById('topbarTitle').textContent={dashboard:'岗位看板',jobs:'岗位管理',resumes:'简历定制',interviews:'面试进度',prep:'面试准备'}[currentView];bind()}
const views={
dashboard(){const soon=upcoming(),salary=state.records.filter(r=>Number(r.salaryMin)>=5000).length,active=state.applications.filter(a=>a.status!=='已拒绝').length,jobs=state.records.filter(r=>r.position).length,notices=state.records.filter(r=>!r.position).length;return`<div class="head"><div><div class="eyebrow">JOB BOARD / DETAIL FIRST</div><h2>岗位和公告，都先留档。</h2><p>有明确公司名且属于 2027 届校园/秋招的记录都会保留；岗位明细暂未公布时允许为空。</p></div><button class="btn primary" data-action="add-record">＋ 手动补充岗位</button></div><div class="stats"><div class="stat"><div class="stat-label">记录总数</div><div class="stat-value">${state.records.length}</div><div class="stat-context">岗位明细 + 招聘公告</div></div><div class="stat"><div class="stat-label">具体岗位</div><div class="stat-value">${jobs}</div><div class="stat-context">可直接对照专业和学历</div></div><div class="stat"><div class="stat-label">招聘公告</div><div class="stat-value">${notices}</div><div class="stat-context">岗位待公布也不丢失</div></div><div class="stat"><div class="stat-label">薪资下限 ≥ 5000</div><div class="stat-value">${salary}</div><div class="stat-context">公告明确写明的岗位</div></div></div><div class="section-title"><h3>即将截止</h3><span>${soon.length?'按日期排序':'未公布截止日期的记录不会进入提醒'}</span></div><div class="deadline-grid"><div class="deadline-list">${soon.length?soon.map(r=>{const d=days(r.deadline);return`<div class="deadline-item"><div class="deadline-date">${fmtDate(r.deadline)}<small>${d===0?'今天':d+'天后'}</small></div><div><div class="deadline-name">${esc(r.company)}${r.position?' · '+esc(r.position):' · 岗位待公布'}</div><div class="deadline-meta">${esc(r.city||'城市未公布')} · ${esc(r.education||'学历未公布')}</div></div>${tag(d<=3?'尽快处理':'待关注','orange')}</div>`}).join(''):'<div class="empty">当前没有已公布且 14 天内截止的记录。</div>'}</div><div class="source-box"><h4>抓取与核验规则</h4><p>${esc(EMBEDDED_DATA.notice)}</p><div class="source-links"><a class="source-link" href="http://www.sasac.gov.cn/n2588035/n2588320/index.html" target="_blank" rel="noreferrer">国资委招聘</a><a class="source-link" href="https://job.mohrss.gov.cn/" target="_blank" rel="noreferrer">中国公共招聘网</a><a class="source-link" href="https://www.guopinwang.com/" target="_blank" rel="noreferrer">国聘网</a></div></div></div><div class="section-title"><h3>全国岗位池</h3><span>岗位明细与招聘公告统一留档</span></div>${table()}`},
jobs(){return`<div class="head"><div><div class="eyebrow">APPLICATION TRACKER</div><h2>岗位管理</h2><p>从未投递到 offer，追踪每一个具体岗位。</p></div><button class="btn primary" data-action="add-job">＋ 手动补充岗位</button></div><div class="pipeline">${statuses.map(s=>{const xs=state.applications.filter(a=>a.status===s);return`<section class="lane"><div class="lane-head"><span>${s}</span><span class="count">${xs.length}</span></div>${xs.length?xs.map(a=>{const r=rec(a.recordId);return`<article class="job-card"><h4>${esc(a.company||r?.company)}</h4><p>${esc(a.position||r?.position)}<br>${esc(r?.city||'城市未公布')} · ${r?.deadline?'截止 '+fmtDate(r.deadline):'截止未公布'}</p><select data-status="${esc(a.id)}">${statuses.map(x=>`<option ${x===s?'selected':''}>${x}</option>`).join('')}</select></article>`}).join(''):'<div class="empty">暂无岗位</div>'}</section>`}).join('')}</div><div class="section-title"><h3>岗位明细</h3><span>${state.applications.length} 条追踪记录</span></div><div class="table-wrap">${jobTable()}</div>`},
resumes(){const r=state.resumes.find(x=>x.id===selectedResume)||state.resumes[0];return`<div class="head"><div><div class="eyebrow">RESUME STUDIO</div><h2>简历定制</h2><p>按方向维护多版简历，用目标 JD 生成修改要点。</p></div><label class="btn">导入 TXT / MD<input id="resumeFile" type="file" accept=".txt,.md" hidden></label></div><div class="split"><div class="version-list">${state.resumes.map(x=>`<button class="version-item ${x.id===r?.id?'active':''}" data-resume="${esc(x.id)}"><strong>${esc(x.name)}</strong><span>${esc(x.direction)}</span></button>`).join('')}<button class="btn subtle" data-action="add-resume" style="margin-top:10px">＋ 新建版本</button></div><div class="editor"><div class="profile-grid"><div><label>我的优势</label><textarea data-profile="strengths">${esc(state.profile.strengths)}</textarea></div><div><label>待改善</label><textarea data-profile="weaknesses">${esc(state.profile.weaknesses)}</textarea></div></div><div><label>${esc(r?.name||'简历版本')} · 内容</label><textarea data-resume-content="${esc(r?.id||'')}" style="min-height:135px">${esc(r?.content||'')}</textarea></div><div class="jd-grid"><div><label>目标岗位 JD</label><textarea id="jdInput" placeholder="粘贴岗位职责、专业要求或任职资格"></textarea></div><div><label>修改要点</label><div class="panel" style="border-top:0;min-height:135px"><ul class="suggestion-list" id="suggestions"><li>输入 JD 后点击生成</li><li>会根据岗位关键词给出可执行改写方向</li></ul></div></div></div><div><button class="btn primary" data-action="generate-jd">生成修改要点</button><button class="btn" data-action="save-profile" style="margin-left:7px">保存个人档案</button></div><div class="small-note">简历文件只在本地读取，不会上传；PDF / DOCX 先提取文字后粘贴。</div></div></div>`},
interviews(){return`<div class="head"><div><div class="eyebrow">INTERVIEW LOG</div><h2>面试进度</h2><p>统一记录每场面试的问题、回答和复盘。</p></div></div><div class="interview-layout"><div class="panel"><h3>面试记录 · ${state.interviews.length}</h3>${state.interviews.length?state.interviews.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(i=>`<div class="interview-row"><div class="interview-date">${esc(i.date)}<small>${esc(i.round)}</small></div><div class="interview-main"><strong>${esc(i.company)}</strong><p><b>问题：</b>${esc(i.questions)}<br><b>复盘：</b>${esc(i.review||'待补充')}</p></div><button class="btn" data-delete-interview="${esc(i.id)}">删除</button></div>`).join(''):'<div class="empty">还没有面试记录。</div>'}</div><div class="panel"><h3>新增一场</h3><form class="form-grid" id="interviewForm"><label>公司 / 单位<input name="company" required></label><label>日期<input name="date" type="date" required></label><label>轮次<select name="round"><option>AI面</option><option>一面</option><option>二面</option><option>终面</option><option>群面</option></select></label><label>问题<input name="questions" required placeholder="用分号分隔"></label><label>复盘<input name="review" placeholder="下一次要补的证据"></label><button class="btn primary" type="submit">保存记录</button></form></div></div>`},
prep(){return`<div class="head"><div><div class="eyebrow">REHEARSAL ROOM</div><h2>面试准备</h2><p>把你的优势、风险和高频问题变成可练习的素材。</p></div></div><div class="prep-grid"><div class="panel"><h3>千问电话面试排练指令</h3><div class="command" id="qwenCommand">你是一名严格但友好的校园招聘面试官。请基于以下候选人档案，进行一场 15 分钟电话面试。每次只问一个问题，等待回答后再追问；覆盖自我介绍、动机、岗位匹配、STAR项目、行业理解、压力场景与反问。最后输出表达清晰度、证据充分度、岗位匹配度和需要重练的3个回答。\n\n优势：${esc(state.profile.strengths)}\n待改善：${esc(state.profile.weaknesses)}</div><p><button class="btn primary" data-action="copy-command">复制指令</button> <span class="small-note">粘贴到通义千问电话 / 语音对话</span></p><div class="section-title"><h3>准备重点</h3></div><div class="profile-grid"><div class="stat"><div class="stat-label">面试时主动证明</div><div class="sub">${esc(state.profile.strengths)}</div></div><div class="stat"><div class="stat-label">回答前先补证据</div><div class="sub">${esc(state.profile.weaknesses)}</div></div></div></div><div class="panel"><h3>高频面试题</h3>${['请做一个 1 分钟自我介绍。','为什么选择我们和这个岗位？','讲一个你推动他人完成任务的例子。','讲一次失败或意见不一致，你如何处理？','如果被安排到基层或异地工作，你怎么看？','你对行业和目标公司的理解是什么？','你还有什么想了解我们的？'].map((q,i)=>`<div class="interview-row" style="grid-template-columns:30px 1fr"><div class="interview-date">0${i+1}</div><div class="interview-main"><strong>${q}</strong></div></div>`).join('')}<div class="section-title"><h3>我的准备清单</h3></div><textarea data-profile="checklist">${esc(state.profile.checklist)}</textarea><button class="btn" data-action="save-profile" style="margin-top:8px">保存清单</button></div></div>`}
};
function table(){const cats=[...new Set(state.records.map(r=>r.category).filter(Boolean))];const cities=[...new Set(state.records.map(r=>r.city).filter(Boolean))];return`<div class="toolbar"><input class="field search" id="search" placeholder="搜索公司、岗位、专业、来源"><select class="field" id="city"><option value="">全国城市</option>${cities.map(x=>`<option>${esc(x)}</option>`).join('')}</select><select class="field" id="category"><option value="">全部性质</option><option>央企</option><option>国企</option><option>民企</option><option>外企</option>${cats.map(x=>`<option>${esc(x)}</option>`).join('')}</select><select class="field" id="education"><option value="">全部学历</option><option>博士</option><option>硕士</option><option>本科</option><option>大专</option></select><select class="field" id="salary"><option value="">全部薪资</option><option value="5000">薪资下限 ≥ 5000</option><option value="8000">薪资下限 ≥ 8000</option></select><select class="field" id="verify"><option value="">全部核验状态</option><option value="true">已核验</option><option value="false">待核验</option></select></div><div class="table-wrap"><table><thead><tr><th>公司名</th><th>记录类型</th><th>岗位</th><th>所需专业</th><th>城市</th><th>类别</th><th>学历要求</th><th>工资</th><th>报名开始</th><th>报名截至</th><th>来源 / 发布时间</th><th>公告</th><th>动作</th></tr></thead><tbody id="recordBody">${rows(state.records)}</tbody></table></div>`}
function rows(xs){return xs.length?xs.map(r=>`<tr><td><div class="company">${esc(r.company)}</div>${r.verified?'<div class="sub">已核验</div>':'<div class="sub">待核验</div>'}</td><td>${tag(r.recordType|| (r.position?'岗位明细':'招聘公告'),r.position?'green':'orange')}</td><td>${esc(r.position||'岗位待公布')}</td><td>${esc(r.major||'未公布')}</td><td>${tag(r.city||'未公布')}</td><td>${tag(r.category||'未分类')}</td><td>${esc(r.education||'未公布')}</td><td>${r.salaryText?tag(r.salaryText,Number(r.salaryMin)>=5000?'green':''): '<span class="muted">未公布</span>'}</td><td>${fmtDate(r.startDate)}</td><td>${fmtDate(r.deadline)}</td><td>${esc(r.source||'未公布')}<div class="sub">${esc(r.publishedAt||'发布时间未公布')}</div></td><td><a href="${esc(r.url)}" target="_blank" rel="noreferrer">打开公告 ↗</a></td><td>${app(r.id)?tag(app(r.id).status):`<button class="btn" data-add-record="${esc(r.id)}">录入</button>`}</td></tr>`).join(''):'<tr><td colspan="13"><div class="empty">暂无符合条件的岗位或招聘公告。点击“同步岗位”或运行同目录抓取脚本。</div></td></tr>'}
function jobTable(){return state.applications.length?`<table><thead><tr><th>公司</th><th>岗位</th><th>城市</th><th>类别</th><th>状态</th><th>学历</th><th>截止</th><th>来源</th><th>操作</th></tr></thead><tbody>${state.applications.map(a=>{const r=rec(a.recordId);return`<tr><td class="company">${esc(a.company||r?.company)}</td><td>${esc(a.position||r?.position)}</td><td>${esc(r?.city||'未公布')}</td><td>${esc(r?.category||'未分类')}</td><td>${tag(a.status,a.status==='offer'?'green':'')}</td><td>${esc(r?.education||'未公布')}</td><td>${fmtDate(r?.deadline)}</td><td>${r?`<a href="${esc(r.url)}" target="_blank">${esc(r.source)}</a>`:'手动补充'}</td><td><button class="btn" data-next="${esc(a.id)}">推进</button></td></tr>`}).join('')}</tbody></table>`:'<div class="empty">暂无岗位。先从岗位看板录入，或手动补充。</div>'}
function filter(){const q=(document.getElementById('search')?.value||'').toLowerCase(),city=document.getElementById('city')?.value||'',cat=document.getElementById('category')?.value||'',edu=document.getElementById('education')?.value||'',salary=Number(document.getElementById('salary')?.value||0),verify=document.getElementById('verify')?.value||'';const list=state.records.filter(r=>(!q||[r.company,r.position,r.major,r.source].join(' ').toLowerCase().includes(q))&&(!city||r.city===city)&&(!cat||r.category===cat)&&(!edu||String(r.education||'').includes(edu))&&(!salary||Number(r.salaryMin)>=salary)&&(!verify||String(Boolean(r.verified))===verify));const body=document.getElementById('recordBody');if(body)body.innerHTML=rows(list)}
function addRecord(id){const r=rec(id);if(!r||app(id))return;state.applications.push({id:'app-'+Date.now(),recordId:id,company:r.company,position:r.position,status:'未投递'});save();render();toast('已录入岗位管理')}
function manualRecord(){const company=prompt('公司名');if(!company)return;const position=prompt('岗位名');if(!position)return;const city=prompt('城市，可留空')||'';const major=prompt('所需专业，可留空')||'';const education=prompt('学历要求，可留空')||'';const startDate=prompt('报名开始 YYYY-MM-DD，可留空')||'';const deadline=prompt('报名截至 YYYY-MM-DD，可留空')||'';const salaryText=prompt('公告明确工资，可留空')||'';const salaryMin=Number((salaryText.match(/\d+/)||[])[0]||0);state.records.unshift({id:'manual-'+Date.now(),company,position,major,city,category:'待分类',education,startDate,deadline,salaryText,salaryMin,source:'手动补充',publishedAt:new Date().toISOString().slice(0,10),url:'#',verified:false});save();render();toast('已补充具体岗位')}
function manualJob(){const company=prompt('公司名');if(!company)return;const position=prompt('岗位名')||'待补充';state.applications.push({id:'app-'+Date.now(),recordId:'manual-'+Date.now(),company,position,status:'未投递'});save();render();toast('已添加岗位')}
function profileSave(){document.querySelectorAll('[data-profile]').forEach(e=>state.profile[e.dataset.profile]=e.value);const e=document.querySelector('[data-resume-content]');if(e){const r=state.resumes.find(x=>x.id===e.dataset.resumeContent);if(r)r.content=e.value}save()}
function generate(){const jd=(document.getElementById('jdInput')?.value||'').toLowerCase(),out=[];[['数据','补充 Excel / SQL / Python、指标口径和量化结果'],['项目','按目标-动作-协作-结果重写项目经历'],['沟通','补充跨部门协作、汇报和推动证据'],['研发','补充技术栈、系统模块和上线结果'],['基层','准备基层锻炼、异地安排和长期发展表达'],['专业','把 JD 专业关键词映射到课程、项目和证书']].forEach(([k,v])=>{if(jd.includes(k))out.push(v)});if(!out.length)out.push('提取 JD 中 3-5 个高频关键词，放入简历标题、项目动作和结果。','每条经历补充数字、范围、时间和个人贡献。','删除与目标岗位无关的描述，保留真实可证明的内容。');document.getElementById('suggestions').innerHTML=out.map(x=>`<li>${esc(x)}</li>`).join('')}
function sync(){const known=new Set(state.records.map(r=>r.id));let n=0;EMBEDDED_DATA.records.forEach(r=>{if(!known.has(r.id)){state.records.push(r);n++}});save();render();toast(n?`已同步 ${n} 条岗位`:'本地已是最新')}
function bind(){document.querySelectorAll('[data-resume]').forEach(e=>e.addEventListener('click',()=>{selectedResume=e.dataset.resume;render()}));['search','city','category','education','salary','verify'].forEach(id=>document.getElementById(id)?.addEventListener('input',filter));document.querySelectorAll('[data-add-record]').forEach(e=>e.addEventListener('click',()=>addRecord(e.dataset.addRecord)));document.querySelectorAll('[data-status]').forEach(e=>e.addEventListener('change',()=>{const a=state.applications.find(x=>x.id===e.dataset.status);if(a){a.status=e.value;save();render()}}));document.querySelectorAll('[data-next]').forEach(e=>e.addEventListener('click',()=>{const a=state.applications.find(x=>x.id===e.dataset.next);if(a){a.status=statuses[Math.min(statuses.length-1,statuses.indexOf(a.status)+1)];save();render()}}));document.querySelectorAll('[data-delete-interview]').forEach(e=>e.addEventListener('click',()=>{state.interviews=state.interviews.filter(x=>x.id!==e.dataset.deleteInterview);save();render()}));document.getElementById('interviewForm')?.addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.target);state.interviews.push({id:'iv-'+Date.now(),date:f.get('date'),company:f.get('company'),round:f.get('round'),questions:f.get('questions'),review:f.get('review')});save();render();toast('面试记录已保存')});document.getElementById('resumeFile')?.addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const reader=new FileReader();reader.onload=()=>{const r=state.resumes.find(x=>x.id===selectedResume);if(r){r.content=reader.result;save();render();toast('简历草稿已导入')}};reader.readAsText(f,'UTF-8')});document.querySelectorAll('[data-profile]').forEach(e=>e.addEventListener('change',profileSave));document.querySelector('[data-resume-content]')?.addEventListener('change',profileSave);document.querySelector('[data-action="generate-jd"]')?.addEventListener('click',generate);document.querySelector('[data-action="save-profile"]')?.addEventListener('click',()=>{profileSave();toast('已保存')});document.querySelector('[data-action="copy-command"]')?.addEventListener('click',()=>navigator.clipboard?.writeText(document.getElementById('qwenCommand').textContent).then(()=>toast('指令已复制')).catch(()=>toast('请手动复制')));document.querySelector('[data-action="add-record"]')?.addEventListener('click',manualRecord);document.querySelector('[data-action="add-job"]')?.addEventListener('click',manualJob);document.querySelector('[data-action="add-resume"]')?.addEventListener('click',()=>{const name=prompt('版本名称');if(name){state.resumes.push({id:'resume-'+Date.now(),name,direction:'待定义方向',content:''});selectedResume=state.resumes.at(-1).id;save();render()}})}
document.querySelectorAll('[data-view]').forEach(e=>e.addEventListener('click',()=>{currentView=e.dataset.view;document.querySelectorAll('[data-view]').forEach(x=>x.classList.toggle('active',x===e));render()}));document.getElementById('refreshBtn').addEventListener('click',sync);document.getElementById('exportBtn').addEventListener('click',()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='全国秋招工作台备份.json';a.click();toast('已导出')});document.getElementById('todayText').textContent=new Intl.DateTimeFormat('zh-CN',{year:'numeric',month:'long',day:'numeric',weekday:'short'}).format(new Date());render();
</script>
</body>
</html>
