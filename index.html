function csvValue(row,names){const wanted=new Set(names.map(normalizeHeader));const key=Object.keys(row).find(candidate=>wanted.has(candidate));return key?String(row[key]??'').trim():''}
function formatDateValue(raw){const text=String(raw??'').trim();if(!text)return'';if(/^\d{10,13}$/.test(text)){const d=new Date(Number(text.length===10?`${text}000`:text));return Number.isNaN(d.getTime())?'':`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}if(/^\d{4,5}(?:\.\d+)?$/.test(text)){const d=new Date(Date.UTC(1899,11,30)+Number(text)*86400000);return `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}-${String(d.getUTCDate()).padStart(2,'0')}`}const match=text.match(/(20\d{2})\D+(\d{1,2})\D+(\d{1,2})/);return match?`${match[1]}-${match[2].padStart(2,'0')}-${match[3].padStart(2,'0')}`:text}
function stableFeishuId(sourceKey){let hash=2166136261;for(const ch of sourceKey){hash^=ch.codePointAt(0);hash=Math.imul(hash,16777619)}return`feishu-${(hash>>>0).toString(16)}`}
function salaryMinimum(text){const match=String(text??'').replace(/,/g,'').match(/\d+(?:\.\d+)?/);return match?Number(match[0]):null}
function recordsFromCsv(text){const rows=parseCsv(text);if(!rows.length)throw new Error('CSV 为空或没有可识别的表头');const records=rows.flatMap(row=>{const company=csvValue(row,['公司名称','公司','单位名称','招聘单位','招聘企业','企业名称']);if(!company)return[];const position=csvValue(row,['岗位名称','招聘岗位','职位名称','工作岗位','岗位']);const city=csvValue(row,['工作地点','工作城市','招聘城市','城市','工作地']);const recordId=csvValue(row,['record_id','recordId','记录ID','记录 id','ID','id']);const sourceKey=recordId?`feishu|${recordId}`:`feishu-export|${company}|${position}|${city}`;const salaryText=csvValue(row,['工资','薪资','薪酬']);return{id:stableFeishuId(sourceKey),sourceKey,company,position,recordType:csvValue(row,['招聘类型','记录类型','类型'])||(position?'岗位明细':'招聘公告'),major:csvValue(row,['所属行业','行业','专业要求','所需专业','专业']),city,category:csvValue(row,['企业性质','企业类型','单位性质','类别']),education:csvValue(row,['学历要求','学历','招聘对象','面向对象']),startDate:formatDateValue(csvValue(row,['报名开始','开始报名','网申开始','投递开始'])),deadline:formatDateValue(csvValue(row,['报名截止','截止时间','网申截止','投递截止'])),salaryText,salaryMin:salaryMinimum(salaryText),source:'my.feishu.cn',publishedAt:formatDateValue(csvValue(row,['发布时间','发布日期','公告日期','发布于'])),url:`https://my.feishu.cn/wiki/UdAtwwZlJiULwskzEe5cSYJZnMe?table=tbl1eASN11JYwTo8&view=vewJRfkcoh${recordId?`&record=${encodeURIComponent(recordId)}`:''}`,verified:true,sourceType:'feishu-export'}});if(!records.length)throw new Error('CSV 中没有包含有效的公司名称记录');return records}
function decodeCsv(buffer){const utf8=new TextDecoder('utf-8').decode(buffer);if(!utf8.includes('�'))return utf8;try{return new TextDecoder('gb18030').decode(buffer)}catch(_){return utf8}}
function applySnapshot(records,feishuOnly=false){const before=feishuOnly?state.records.filter(isFeishuRecord):sourceRecords(state.records),incoming=sourceRecords(records).filter(r=>!feishuOnly||isFeishuRecord(r)),beforeByKey=new Map(before.map(r=>[recordKey(r),r])),incomingByKey=new Map(incoming.map(r=>[recordKey(r),r]));const added=incoming.filter(r=>!beforeByKey.has(recordKey(r))).length,removed=before.filter(r=>!incomingByKey.has(recordKey(r))).length,changed=incoming.filter(r=>{const old=beforeByKey.get(recordKey(r));return old&&JSON.stringify(old)!==JSON.stringify(r)}).length;before.forEach(old=>{const next=incomingByKey.get(recordKey(old));if(next&&old.id!==next.id)state.applications.filter(a=>a.recordId===old.id).forEach(a=>{a.recordId=next.id})});if(feishuOnly){const local=state.records.filter(isLocalRecord),other=state.records.filter(r=>!isLocalRecord(r)&&!isFeishuRecord(r));state.records=[...local,...other,...incoming]}else{mergeSourceSnapshot(incoming)}return{added,changed,removed}}
async function fetchPublishedSnapshot(){const response=await fetch(`${SOURCE_DATA_URL}?t=${Date.now()}`,{cache:'no-store'});if(!response.ok)throw new Error(`HTTP ${response.status}`);return response.json()}
async function waitForPublishedSnapshot(previous){for(let attempt=0;attempt<36;attempt++){const payload=await fetchPublishedSnapshot();if(payload.generatedAt&&payload.generatedAt!==previous){lastPublishedAt=payload.generatedAt;return payload}await new Promise(resolve=>setTimeout(resolve,5000))}throw new Error('云端任务仍在运行，请稍后再次刷新')}
async function fetchRefreshPayload(){if(!WORKFLOW_TRIGGER_URL)throw new Error('尚未配置云端刷新入口');const response=await fetch(WORKFLOW_TRIGGER_URL,{method:'POST'});if(!response.ok)throw new Error(`刷新任务启动失败：HTTP ${response.status}`);const queued=await response.json();if(queued.status!=='queued')throw new Error(queued.message||'刷新任务启动失败');return{payload:await waitForPublishedSnapshot(lastPublishedAt),local:false,mode:'snapshot',workflow:true}}
async function importFeishuCsv(file){try{toast('正在读取飞书 CSV');const records=recordsFromCsv(decodeCsv(await file.arrayBuffer()));const result=applySnapshot(records,true);save();render();toast(`飞书 CSV 已导入：新增 ${result.added}，更新 ${result.changed}，移除 ${result.removed}`)}catch(error){toast(`CSV 导入失败：${error.message}`)}}
async function sync(notify=true,useLocal=true){const button=document.getElementById('refreshBtn');if(button)button.disabled=true;if(notify)toast(useLocal?'正在读取飞书最新数据':'正在读取已发布数据');try{const result=await fetchRefreshPayload(useLocal),payload=result.payload;if(!Array.isArray(payload.records))throw new Error('records must be an array');const incoming=sourceRecords(payload.records),feishuOnly=result.mode==='feishu'||(incoming.length>0&&incoming.every(isFeishuRecord)),summary=applySnapshot(incoming,feishuOnly);save();render();if(notify){const label=result.csv?'飞书 CSV 已读取':result.local?'飞书已同步':result.fallback?'已读取已发布数据':'已读取最新数据';toast(`${label}：新增 ${summary.added}，更新 ${summary.changed}，移除 ${summary.removed}`)}}catch(error){if(notify)toast(location.protocol==='file:'?'刷新失败：请通过本地服务器打开页面':'刷新失败：'+error.message)}finally{if(button)button.disabled=false}}
async function ensureOcr(){if(window.Tesseract)return window.Tesseract;return await new Promise((resolve,reject)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';s.onload=()=>resolve(window.Tesseract);s.onerror=reject;document.head.appendChild(s)})}
async function recognizeImage(file){toast('正在识别图片文字，请稍候');try{const t=await ensureOcr(),result=await t.recognize(file,'chi_sim+eng',{logger:m=>{if(m.status==='recognizing text')toast(`图片识别 ${Math.round((m.progress||0)*100)}%`)}});const area=document.getElementById('ocrText');if(area){area.value=result.data.text.trim();toast('识别完成，请检查公司名后保存')}}catch(_){toast('OCR加载失败，可直接把图片文字粘贴到文本框') }}
function saveCapture(){const text=(document.getElementById('ocrText')?.value||'').trim();if(!text){toast('请先上传图片或粘贴文字');return}state.captures=[{id:'capture-'+Date.now(),text,createdAt:new Date().toISOString(),source:'图片 / 求职信息博主笔记'},...(state.captures||[])];save();toast('图片笔记已保存在本机')}
function captureRecord(){const text=(document.getElementById('ocrText')?.value||'').trim();if(!text){toast('请先上传图片或粘贴文字');return}const company=prompt('请输入图片中明确出现的公司名（必填）');if(!company)return;const position=prompt('岗位名，可留空')||'';const city=prompt('城市，可留空')||'';const major=prompt('所需专业，可留空')||'';const education=prompt('学历要求，可留空')||'';const deadline=prompt('报名截至 YYYY-MM-DD，可留空')||'';state.records.unshift({id:'capture-record-'+Date.now(),company,position,recordType:position?'岗位明细':'招聘公告',major,city,category:'待核验',education,startDate:'',deadline,salaryText:'',salaryMin:null,source:'图片 / 求职信息博主笔记',publishedAt:new Date().toISOString().slice(0,10),url:'#',verified:false,sourceType:'image-note',note:text});save();render();toast('已保存为待核验记录')}
function bind(){document.querySelectorAll('[data-resume]').forEach(e=>e.addEventListener('click',()=>{selectedResume=e.dataset.resume;render()}));['search','city','category','education','salary','verify'].forEach(id=>document.getElementById(id)?.addEventListener('input',filter));document.querySelectorAll('[data-add-record]').forEach(e=>e.addEventListener('click',()=>addRecord(e.dataset.addRecord)));document.querySelectorAll('[data-status]').forEach(e=>e.addEventListener('change',()=>{const a=state.applications.find(x=>x.id===e.dataset.status);if(a){a.status=e.value;save();render()}}));document.querySelectorAll('[data-next]').forEach(e=>e.addEventListener('click',()=>{const a=state.applications.find(x=>x.id===e.dataset.next);if(a){a.status=statuses[Math.min(statuses.length-1,statuses.indexOf(a.status)+1)];save();render()}}));document.querySelectorAll('[data-delete-interview]').forEach(e=>e.addEventListener('click',()=>{state.interviews=state.interviews.filter(x=>x.id!==e.dataset.deleteInterview);save();render()}));document.getElementById('interviewForm')?.addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.target);state.interviews.push({id:'iv-'+Date.now(),date:f.get('date'),company:f.get('company'),round:f.get('round'),questions:f.get('questions'),review:f.get('review')});save();render();toast('面试记录已保存')});document.getElementById('feishuCsvInput')?.addEventListener('change',e=>{const f=e.target.files[0];if(f)importFeishuCsv(f);e.target.value=''});document.getElementById('resumeFile')?.addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const reader=new FileReader();reader.onload=()=>{const r=state.resumes.find(x=>x.id===selectedResume);if(r){r.content=reader.result;save();render();toast('简历草稿已导入')}};reader.readAsText(f,'UTF-8')});document.querySelector('[data-action="export-docx"]')?.addEventListener('click',exportDocx);document.getElementById('imageInput')?.addEventListener('change',e=>{const f=e.target.files[0];if(f)recognizeImage(f)});document.querySelector('[data-action="save-capture"]')?.addEventListener('click',saveCapture);document.querySelector('[data-action="capture-record"]')?.addEventListener('click',captureRecord);document.querySelectorAll('[data-profile]').forEach(e=>e.addEventListener('change',profileSave));document.querySelector('[data-resume-content]')?.addEventListener('change',profileSave);document.querySelector('[data-action="generate-jd"]')?.addEventListener('click',generate);document.querySelector('[data-action="save-profile"]')?.addEventListener('click',()=>{profileSave();toast('已保存')});document.querySelector('[data-action="copy-command"]')?.addEventListener('click',()=>navigator.clipboard?.writeText(document.getElementById('qwenCommand').textContent).then(()=>toast('指令已复制')).catch(()=>toast('请手动复制')));document.querySelector('[data-action="add-record"]')?.addEventListener('click',manualRecord);document.querySelector('[data-action="add-job"]')?.addEventListener('click',manualJob);document.querySelector('[data-action="add-resume"]')?.addEventListener('click',()=>{const name=prompt('版本名称');if(name){state.resumes.push({id:'resume-'+Date.now(),name,direction:'待定义方向',content:''});selectedResume=state.resumes.at(-1).id;save();render()}});document.getElementById('channelFab')?.addEventListener('click',()=>{const d=document.getElementById('channelDrawer'),open=d.classList.toggle('open');document.getElementById('channelFab').setAttribute('aria-expanded',open);if(open&&!document.getElementById('channelLinks').children.length)document.getElementById('channelLinks').innerHTML=CHANNEL_SOURCES.map(([name,url])=>`<a class="channel-link" href="${url}" target="_blank" rel="noreferrer">${name}</a>`).join('')})}
 document.querySelectorAll('[data-view]').forEach(e=>e.addEventListener('click',()=>{currentView=e.dataset.view;document.querySelectorAll('[data-view]').forEach(x=>x.classList.toggle('active',x===e));render()}));document.getElementById('refreshBtn').addEventListener('click',()=>sync(true,true));document.getElementById('exportBtn').addEventListener('click',()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='全国秋招工作台备份.json';a.click();toast('已导出')});document.getElementById('todayText').textContent=new Intl.DateTimeFormat('zh-CN',{year:'numeric',month:'long',day:'numeric',weekday:'short'}).format(new Date());render();
</script>
