services:
  - type: web
    name: findwork-feishu-sync
    runtime: docker
    dockerfilePath: ./mcp-server/Dockerfile
    dockerContext: ./mcp-server
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ALLOWED_ORIGIN
        value: https://asiz13.github.io
      - key: FEISHU_SOURCE_URL
        sync: false
